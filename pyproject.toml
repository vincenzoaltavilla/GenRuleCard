[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genrulecard"
version = "0.1.0"
description = "Generate interpretable scorecards with an FMI-regularized VAE and genetic search."
requires-python = ">=3.10,<3.11"
dependencies = [
    "joblib==1.5.3",
    "matplotlib==3.10.9",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "seaborn",
    "torch",
    "tqdm==4.67.1",
    "RuleTree==2026.4.16.161406",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
